<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Teamspace{% endblock %}</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b2030;--mu:#667085;--line:#e4e7ec;--pri:#5b3fd6;--ok:#12805c;--bad:#c0362c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--pri);text-decoration:none}a:hover{text-decoration:underline}
header{background:#14102b;color:#fff}header .in{max-width:960px;margin:0 auto;padding:12px 20px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
header a{color:#cfc8f5}header .sp{flex:1}header b{margin-right:6px}
main{max-width:960px;margin:0 auto;padding:24px 20px 60px}
h1{font-size:24px;margin:0 0 14px}h2{font-size:17px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px;overflow-x:auto}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
button,.btn{display:inline-block;background:var(--pri);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
button.g,.btn.g{background:#fff;color:var(--tx);border:1px solid var(--line)}button.d{background:var(--bad)}
input,select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit}
label{display:block;font-weight:600;margin:12px 0 4px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.help{color:var(--mu);font-size:13px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.msg{padding:10px 14px;border-radius:8px;margin-bottom:12px;background:#eef2ff;overflow-wrap:anywhere}.msg.error{background:#fdeceb;color:var(--bad)}.msg.success{background:#e4f6ee;color:var(--ok)}
.bar{height:8px;background:#eceef3;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
.tag{font-size:12px;padding:1px 8px;border-radius:99px;background:#eee9ff;color:#4a32b8}
.done{text-decoration:line-through;color:var(--mu)}
</style></head><body>
<header><div class="in"><b>Teamspace</b>
{% if user.is_authenticated %}
<a href="{% url 'dashboard' %}">Tasks</a><a href="{% url 'team' %}">Team</a><a href="{% url 'billing' %}">Billing</a>
<span class="sp"></span>
{% if request.workspace %}<span class="tag">{{ request.workspace.name }} · {{ request.workspace.get_plan_display }}</span>{% endif %}
<span>{{ user.get_username }}</span>
<form method="post" action="{% url 'logout' %}" style="margin:0">{% csrf_token %}<button class="g" style="padding:4px 10px">Log out</button></form>
{% endif %}</div></header>
<main>
{% for m in messages %}<div class="msg {{ m.tags }}">{{ m }}</div>{% endfor %}
{% block content %}{% endblock %}</main></body></html>
